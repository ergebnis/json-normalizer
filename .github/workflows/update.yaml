# https://help.github.com/en/categories/automating-your-workflow-with-github-actions

name: "Update"

on: # yamllint disable-line rule:truthy
  schedule:
    - cron: "0 9 * * *"

permissions: {}

jobs:
  schema:
    name: "Schema"

    runs-on: "ubuntu-24.04"

    strategy:
      matrix:
        php-version:
          - "7.4"

        dependencies:
          - "locked"

    steps:
      - name: "Checkout"
        uses: "actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1" # v7.0.1
        with:
          persist-credentials: false

      - name: "Set up PHP"
        uses: "shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240" # 2.37.2
        with:
          coverage: "none"
          php-version: "${{ matrix.php-version }}"

      - name: "Download schema"
        run: "wget --output-document=test/Fixture/Vendor/Composer/schema.json https://getcomposer.org/schema.json"

      - name: "Show diff"
        run: "git diff test/Fixture/Vendor/Composer/schema.json"

      - name: "Determine composer root version"
        uses: "ergebnis/.github/actions/composer/determine-root-version@07ba5718eac189644381e5972cd671c80c135ae7" # 1.13.4

      - name: "Determine composer cache directory"
        uses: "ergebnis/.github/actions/composer/determine-cache-directory@07ba5718eac189644381e5972cd671c80c135ae7" # 1.13.4

      - name: "Cache dependencies installed with composer"
        uses: "actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9" # v6.1.0
        with:
          path: "${{ env.COMPOSER_CACHE_DIR }}"
          key: "php-${{ matrix.php-version }}-composer-${{ matrix.dependencies }}-${{ hashFiles('composer.lock') }}"
          restore-keys: "php-${{ matrix.php-version }}-composer-${{ matrix.dependencies }}-"

      - name: "Install ${{ matrix.dependencies }} dependencies with composer"
        uses: "ergebnis/.github/actions/composer/install@07ba5718eac189644381e5972cd671c80c135ae7" # 1.13.4
        with:
          dependencies: "${{ matrix.dependencies }}"

      - name: "Laxify schema"
        run: "php bin/laxify-schema.php"

      - name: "Open pull request updating schema"
        uses: "gr2m/create-or-update-pull-request-action@b65137ca591da0b9f43bad7b24df13050ea45d1b" # v1.10.1
        with:
          author: "ergebnis-bot <bot@ergebn.is>"
          branch: "feature/schema"
          body: |
            This PR

            - [x] updates `schema.json`
          commit-message: "Enhancement: Update schema.json"
          path: "test/Fixture/Vendor/Composer/"
          title: "Enhancement: Update `schema.json`"
        env:
          GITHUB_TOKEN: "${{ secrets.ERGEBNIS_BOT_TOKEN }}"
